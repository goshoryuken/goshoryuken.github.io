<circle class="dv2" cx="80.0" cy="200.8" r="3"/>
<circle class="dv2" cx="210.5" cy="221.6" r="3"/>
<circle class="dv2" cx="266.7" cy="208.2" r="3"/>
<circle class="dv2" cx="397.1" cy="172.6" r="3"/>
<circle class="dv2" cx="453.3" cy="152.4" r="3"/>
<circle class="dv2" cx="583.8" cy="107.7" r="3"/>
<circle class="dv2" cx="640.0" cy="87.9" r="3"/>
<text class="l2" x="650.0" y="91.9">GPU v2</text>
