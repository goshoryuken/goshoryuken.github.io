<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-labelledby="t d">
<title id="t">Simulation runtime vs. cycles, CPU and two GPU versions</title>
<desc id="d">Log-log plot. GPU v1 is slower than the CPU at every size. GPU v2 overtakes the CPU near 500 cycles and is about 2x faster at 100,000 cycles: 11,288 ms vs 23,345 ms.</desc>
<style>.bg{fill:#fbfaf7}.g{stroke:#e4e1d9;stroke-width:1}.ax{stroke:#17191d;stroke-width:1}
.t{font:400 12px "IBM Plex Mono",ui-monospace,Menlo,monospace;fill:#4b505a}
.cpu{stroke:#17191d}.v1{stroke:#9a9ea5;stroke-dasharray:5 4}.v2{stroke:#b2441b}
.ln{fill:none;stroke-width:2.2}.dcpu{fill:#17191d}.dv1{fill:#9a9ea5}.dv2{fill:#b2441b}
.lc{font:600 12px "IBM Plex Mono",ui-monospace,monospace;fill:#17191d}.l1{font:500 12px "IBM Plex Mono",ui-monospace,monospace;fill:#7a7f88}.l2{font:600 12px "IBM Plex Mono",ui-monospace,monospace;fill:#b2441b}
@media (prefers-color-scheme:dark){.bg{fill:#1a1c20}.g{stroke:#2c2e33}.ax{stroke:#e9e7e2}.t{fill:#b0b0aa}.cpu{stroke:#e9e7e2}.dcpu{fill:#e9e7e2}.lc{fill:#e9e7e2}
.v2{stroke:#e5794b}.dv2{fill:#e5794b}.l2{fill:#e5794b}.v1{stroke:#6f7278}.dv1{fill:#6f7278}}</style>
<rect class="bg" width="740" height="340"/>
<line class="g" x1="80" y1="294.0" x2="640" y2="294.0"/>
<text class="t" x="70" y="298.0" text-anchor="end">10</text>
<line class="g" x1="80" y1="226.5" x2="640" y2="226.5"/>
<text class="t" x="70" y="230.5" text-anchor="end">100</text>
<line class="g" x1="80" y1="159.0" x2="640" y2="159.0"/>
<text class="t" x="70" y="163.0" text-anchor="end">1,000</text>
<line class="g" x1="80" y1="91.5" x2="640" y2="91.5"/>
<text class="t" x="70" y="95.5" text-anchor="end">10,000</text>
<line class="g" x1="80" y1="24.0" x2="640" y2="24.0"/>
<text class="t" x="70" y="28.0" text-anchor="end">100,000</text>
<line class="g" x1="80.0" y1="24" x2="80.0" y2="294"/>
<text class="t" x="80.0" y="314" text-anchor="middle">100</text>
<line class="g" x1="266.7" y1="24" x2="266.7" y2="294"/>
<text class="t" x="266.7" y="314" text-anchor="middle">1,000</text>
<line class="g" x1="453.3" y1="24" x2="453.3" y2="294"/>
<text class="t" x="453.3" y="314" text-anchor="middle">10,000</text>
<line class="g" x1="640.0" y1="24" x2="640.0" y2="294"/>
<text class="t" x="640.0" y="314" text-anchor="middle">100,000</text>
<line class="ax" x1="80" y1="294" x2="640" y2="294"/>
<text class="t" x="360.0" y="334" text-anchor="middle">simulated cycles (log)</text>
<text class="t" x="16" y="159.0" transform="rotate(-90 16 159.0)" text-anchor="middle">runtime, ms (log)</text>
<polyline class="ln v1" points="80.0,217.5 210.5,193.6 266.7,176.0 397.1,132.2 453.3,113.2 583.8,63.2 640.0,42.5"/>
