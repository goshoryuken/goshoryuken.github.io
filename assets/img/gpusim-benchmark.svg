<polyline class="ln cpu" points="80.0,269.6 210.5,223.4 266.7,203.4 397.1,156.2 453.3,135.2 583.8,87.0 640.0,66.6"/>
<circle class="dcpu" cx="80.0" cy="269.6" r="3"/>
<circle class="dcpu" cx="210.5" cy="223.4" r="3"/>
