<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" role="img" aria-labelledby="t d">
<title id="t">Exploded view of a two-layer CLB</title>
<desc id="d">One CLB occupies two stacked layers. FLEs 0 to 4 sit on the bottom anchor layer with the crossbar and all external pins; FLEs 5 to 9 sit one layer up. Signals cross between layers only through internal links.</desc>
<style>
  .bg{fill:#fbfaf7}.slab{fill:#ebe8e0;stroke:#9a978e;stroke-width:1}.face{fill:#d8d4c9;stroke:#9a978e}.side{fill:#cbc6b8;stroke:#9a978e}
  .fle0{fill:#ffffff;stroke:#17191d;stroke-width:1.2}.fle1{fill:#f4d8cb;stroke:#b2441b;stroke-width:1.2}
  .strip{fill:#ffffff;stroke:#17191d;stroke-width:1}.strip-u{fill:none;stroke:#b2441b;stroke-width:1;stroke-dasharray:4 3}
  .link{stroke:#b2441b;stroke-width:1.4;stroke-dasharray:5 4}.dot{fill:#b2441b}.pin{stroke:#17191d;stroke-width:1.4}
  .lbl{font:500 12px "IBM Plex Mono",ui-monospace,Menlo,monospace;fill:#17191d}
  .sm{font:400 11px "IBM Plex Mono",ui-monospace,Menlo,monospace;fill:#4b505a}
  .hd{font:600 12px "IBM Plex Mono",ui-monospace,Menlo,monospace;fill:#b2441b;letter-spacing:.06em}
  .lead{stroke:#7a7f88;stroke-width:1}
  @media (prefers-color-scheme:dark){
    .bg{fill:#1a1c20}.slab{fill:#2a2c31;stroke:#55575d}.face{fill:#222428;stroke:#55575d}.side{fill:#1d1f23;stroke:#55575d}
    .fle0{fill:#33363c;stroke:#e9e7e2}.fle1{fill:#4a2b1e;stroke:#e5794b}.strip{fill:#33363c;stroke:#e9e7e2}
    .strip-u{stroke:#e5794b}.link{stroke:#e5794b}.dot{fill:#e5794b}.pin{stroke:#e9e7e2}
    .lbl{fill:#e9e7e2}.sm{fill:#b0b0aa}.hd{fill:#e5794b}.lead{stroke:#85868a}
  }
</style>
